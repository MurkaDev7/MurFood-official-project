<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MurFood - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-profile">
        <div class="header-left-profile">
            <img class="back-btn" src="src/back.png" alt="Back">
        </div>
        <div class="header-text-profile">
            <h1>Profile</h1>
        </div>
        <button class="burger">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="shop.html">
            <img class="imagee" src="src/shop-Photoroom.png" alt="Shopping cart">\
            <span class="cart-count"></span>
            
        </a>
    </header>

    
    <div class="menu-overlay"></div>
    
    <nav class="side-menu">
        <button class="menu-close" type="button">×</button>
        <a href="index.html">Main page</a>
        <a href="menu.html">Menu</a>
        <a href="shop.html">Shop</a>
        <a href="profile.html">Profile</a>
        <a href="about.html">About</a>
    </nav>
    
    <main class="main-profile">

        <div class="profile-block">
            <div class="Users-Profile">
                <img id="profile-avatar" src="src/profileP.png" alt="User avatar">
                <div class="username">
                    <h2 id="profile-name"></h2>
                    <span id="profile-login"></span>
                    <div class="Users-money">
                        <p id="profile-money"></p>
                    </div>
                </div>
            </div>

            <div class="Users-description">
                <p id="profile-about"></p>
            </div>

            <button class="edit-btn" type="button">change</button>

            <button class="logout-btn" type="button">logout</button>

            <section class="favorite-food-section">
                <h2>User 1's favorite food</h2>
            </section>

            <!-- Этот блок пустой специально: сюда main.js кладёт
                 то, что человек заказал в последний раз -->
            <div class="favorite-food-grid"></div>
        </div>

        <form class="edit-form hidden">
            <label for="edit-name">Name</label>
            <input id="edit-name" type="text">

            <label for="edit-about">About</label>
            <input id="edit-about" type="text">

            <label>Avatar</label>
            <div class="avatars">
                <img src="src/profileP.png" alt="standart">
                <img src="src/pizza.png" alt="pizza">
                <img src="src/water.png" alt="water">
                <img src="src/sprite.png" alt="sprite">
            </div>

            <label for="edit-file">import avatar</label>
            <input id="edit-file" type="file" accept="image/*">

            <button type="submit">save</button>
        </form>

        <div class="guest-block">
            <p>You didn't log in.</p>
            <a href="login.html">log in</a>
        </div>

    </main>

    <footer>
        <div class="footer-left">
            <a href="index.html">
                <img src="src/MurFood Logo2.png" alt="MurFood logo">
            </a>
            <a href="about.html">About</a>
        </div>
        <div class="footer-right">
            <img class="discord" src="src/Discord 1.png" alt="Discord">
            <img class="youtube" src="src/Youtube 1.png" alt="YouTube">
            <img class="telegram" src="src/Telegram 1.png" alt="Telegram">
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
