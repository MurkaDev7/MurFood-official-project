<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MurFood - login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-about">
        <div class="header-left-about">
            <img class="back-btn" src="src/back.png" alt="Back">
        </div>
        <div class="header-text-about">
            <h1>login</h1>
        </div>
        <a href="shop.html">
            <img class="imagee" src="src/shop-Photoroom.png" alt="Shopping cart">
        </a>
    </header>

    <main class="main-login">

        <h2 class="login-title">Вход</h2>

        <form class="login-form">
            <label for="login-login">Логин</label>
            <input id="login-login" type="text">

            <label for="login-password">Пароль</label>
            <input id="login-password" type="password">

            <button type="submit">войти</button>
            <p class="form-msg"></p>
        </form>

        <h2 class="login-title">Регистрация</h2>

        <form class="register-form">
            <label for="reg-login">Придумай логин</label>
            <input id="reg-login" type="text">

            <label for="reg-password">Придумай пароль</label>
            <input id="reg-password" type="password">

            <label for="reg-name">Как тебя зовут</label>
            <input id="reg-name" type="text">

            <button type="submit">создать профиль</button>
            <p class="form-msg"></p>
        </form>

    </main>

    <footer>
        <div class="footer-left">
            <img src="src/MurFood Logo2.png" alt="MurFood logo">
            <a href="about.html">About</a>
        </div>
        <div class="footer-right">
            <img class="discord" src="src/Discord 1.png" alt="Discord">
            <img class="youtube" src="src/Youtube 1.png" alt="YouTube">
            <img class="telegram" src="src/Telegram 1.png" alt="Telegram">
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
