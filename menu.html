<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MurFood - menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-menu">
        <div class="header-left">
            <img class="back-btn" src="src/back.png" alt="Back">
        </div>
        <div class="header-text">
            <h1>drinks</h1>
        </div>
        <button class="burger">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="shop.html">
            <img class="imagee" src="src/shop-Photoroom.png" alt="Shopping cart">
            <span class="cart-count"></span>
        </a>
    </header>

    
    <div class="menu-overlay"></div>
    
    <nav class="side-menu">
        <button class="menu-close" type="button">×</button>
        <a href="index.html">Main page</a>
        <a href="menu.html">Menu</a>
        <a href="shop.html">Shop</a>
        <a href="profile.html">Profile</a>
        <a href="about.html">About</a>
    </nav>

    <main class="main-menu">
        <div class="carts-menu-drinks">
            <div class="cart-menu">
                <div class="first-part">
                    <p class="p-menu1">water</p>
                    <div class="white-background-img">
                        <img src="src/water.png" alt="Glass of water">
                    </div>
                </div>
                <div class="second-part">
                    <button class="use-btn">use</button>
                    <p class="p-menu2">4$</p>
                </div>
            </div>

            <div class="cart-menu">
                <div class="first-part">
                    <p class="p-menu1">cola</p>
                    <div class="white-background-img">
                        <img src="src/Coca cola.png" alt="Can of cola">

                </div>
                <div class="second-part">
                    <button class="use-btn">use</button>
                    <p class="p-menu2">7$</p>
                </div>
            </div>

            <div class="cart-menu">
                <div class="first-part">
                    <p class="p-menu1">sprite</p>
                    <div class="white-background-img">
                        <img src="src/sprite.png" alt="Bottle of sprite">

                <div class="second-part">
                    <button class="use-btn">use</button>
                    <p class="p-menu2">5$</p>

        </section>

            <div class="cart-menu">
                <div class="first-part">
                    <p class="p-menu1">sandwich</p>
                    <div class="white-background-imgo">

                </div>
                <div class="second-part">
                    <button class="use-btn">use</button>
                    <p class="p-menu2">13$</p>
                </div>
            </div>

            <div class="cart-menu">
                <div class="first-part">
                    <p class="p-menu1">pasta</p>
                    <div class="white-background-imgo">
                        <img src="src/makaronyi.jpg" alt="Plate of pasta">
                    </div>
                </div>
                <div class="second-part">
                    <button class="use-btn">use</button>
                    <p class="p-menu2">17$</p>

            <div class="cart-menu">

                    <p class="p-menu1">special pasta</p>

                <div class="second-part">
                    <button class="use-btn">use</button>
                    <p class="p-menu2">11$</p>
                </div>
            </div>

            <div class="cart-menu">
                <div class="first-part">
                    <p class="p-menu1">sandwich in dutch</p>
                    <div class="white-background-imgo">

                </div>
                <div class="second-part">
                    <button class="use-btn">use</button>
                    <p class="p-menu2">19$</p>
                </div>
            </div>

            <div class="cart-menu">
                <div class="first-part">
                    <p class="p-menu1">pizza</p>
                    <div class="white-background-imgo">
                        <img src="src/pizza.png" alt="Pepperoni pizza">

                </div>
                <div class="second-part">
                    <button class="use-btn">use</button>
                    <p class="p-menu2">16$</p>
                </div>
            </div>

            <div class="cart-menu">
                <div class="first-part">
                    <p class="p-menu1">salad</p>
                    <div class="white-background-imgo">

                <div class="second-part">
                    <button class="use-btn">use</button>

                </div>

    <footer>
        <div class="footer-left">
            <a href="index.html">
                <img src="src/MurFood Logo2.png" alt="MurFood logo">
            </a>
            <a href="about.html">About</a>
        </div>
        <div class="footer-right">
            <img class="discord" src="src/Discord 1.png" alt="Discord">
            <img class="youtube" src="src/Youtube 1.png" alt="YouTube">
            <img class="telegram" src="src/Telegram 1.png" alt="Telegram">
        </div>
    </footer>

    <script src="main.js"></script>

</html>
