<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MurFood - Main Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="section">
            <div class="left">
                <img src="src/MurFood Logo2.png" alt="MurFood logo">
                <a href="about.html">About</a>
            </div>
            <div class="right">
                <a href="shop.html">
                    <img class="imagee" src="src/shop-Photoroom.png" alt="Shopping cart">
                </a>

                <a href="profile.html">
                    <img src="src/Profile.png" alt="User profile">
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="description">
            <div class="text">
                <p>MurFood is a service that delivers fresh, appetizing meals for every day.</p>
            </div>

            <div class="rightpart">
                <img src="src/Sandwich.jpe" alt="Grilled sandwich on a plate">
                <a class="menu-btn" href="menu.html">menu</a>
            </div>
        </div>

        <section class="section-top3">
            <h1>top 3 our food</h1>
        </section>

        <div class="cards">
            <div class="card">
                <p class="p1">1st</p>
                <img src="src/specialPasta.jpe" alt="Special pasta">
                <p class="p2">special pasta</p>
            </div>

            <div class="card">
                <p class="p1">2nd</p>
                <img src="src/makaronyi.jpg" alt="Pasta">
                <p class="p2">pasta</p>
            </div>

            <div class="card">
                <p class="p1">3rd</p>
                <img src="src/sandwich1.webp" alt="Sandwich in dutch">
                <p class="p2">sandwich in dutch</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-left">
            <img src="src/MurFood Logo2.png" alt="MurFood logo">
            <a href="about.html">About</a>
        </div>
        <div class="footer-right">
            <img class="discord" src="src/Discord 1.png" alt="Discord">
            <img class="youtube" src="src/Youtube 1.png" alt="YouTube">
            <img class="telegram" src="src/Telegram 1.png" alt="Telegram">
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
